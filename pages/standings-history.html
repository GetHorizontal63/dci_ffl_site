<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standings History - Past Seasons</title>
    <link rel="stylesheet" href="../css/division-page.css">
    <link rel="stylesheet" href="../css/bracket.css">
    <link rel="stylesheet" href="../css/history-pages.css">
    <link rel="stylesheet" href="../css/mobile.css">
</head>
<body class="hp-standings frozen-page frozen-tall">
    <!-- Navigation -->
    <nav class="navbar past-seasons-nav">
        <div class="nav-container">
            <a href="../index.html" class="logo">
                <img src="../assets/logos/logo_2.png" alt="League Logo" class="nav-logo">
                <div class="logo-text">
                    <h1>GRASS TOUCHERS</h1>
                    <p>FANTASY FOOTBALL LEAGUE</p>
                </div>
            </a>
            <div class="nav-links">
                <a href="../index.html">HOME</a>
                <a href="current-season.html">CURRENT SEASON</a>
                <a href="past-seasons.html">PAST SEASONS</a>
                <a href="coming-soon.html">MEMBERS</a>
            </div>
        </div>
    </nav>

    <!-- Back Navigation -->
    <div class="page-back-nav past-seasons-back-nav">
        <a href="past-seasons.html" class="back-link">← Back to Past Seasons</a>
    </div>

    <section class="section-content standings-section">
        <div class="search-container">
            <div class="frozen-head">
            <h1 class="page-title">Standings History</h1>

            <div class="hp-controls">
                <div class="hp-field">
                    <label class="hp-label" for="season-select">Season</label>
                    <select id="season-select" class="hp-select"><option>Loading...</option></select>
                </div>
                <div class="hp-field">
                    <label class="hp-label" for="week-select">Week</label>
                    <select id="week-select" class="hp-select"><option>Loading...</option></select>
                </div>
                <div class="hp-field">
                    <span class="hp-label">Champion</span>
                    <span class="hp-value" id="hp-champion">-</span>
                </div>
                <div class="hp-field hp-wide">
                    <span class="hp-label">Ranking</span>
                    <span class="hp-value" id="hp-ranking">-</span>
                </div>
                <div class="hp-field hp-wide">
                    <span class="hp-label">Brackets</span>
                    <span class="hp-value" id="hp-bracket-note">-</span>
                </div>
            </div>

            </div>

            <div id="hp-content" class="frozen-body"><div class="hp-loading">Loading standings...</div></div>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js"></script>
    <script src="../js/league-db.js"></script>
    <script src="../js/playoff-numbers.js"></script>
    <script src="../js/bracket-view.js"></script>
    <script src="../js/standings-history.js"></script>
    <script src="../js/mobile.js"></script>
</body>
</html>
